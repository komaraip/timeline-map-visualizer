name: Bug report
description: Report a reproducible problem without sharing personal Timeline data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never upload a real Timeline export, coordinates, addresses, or Place IDs. Create a minimal synthetic sample instead."
  - type: dropdown
    id: format
    attributes:
      label: Source format
      options: [Timeline.json, Semantic Location History, Records.json, ZIP archive, Synthetic demo]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
